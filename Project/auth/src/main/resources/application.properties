spring.application.name=auth-service
server.port=8081
# ==========================
# Database Configuration
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# Hibernate / JPA
# ==========================
# Dialect is auto-detected by Hibernate 6+
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Security & JWT Configuration
jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_32_chars_min}
jwt.expiration-ms=86400000
