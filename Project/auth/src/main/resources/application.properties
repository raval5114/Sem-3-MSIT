spring.application.name=auth-service
server.port=8081
# ==========================
# Database Configuration (PostgreSQL)
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scdp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:scdp_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:scdp_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# Hibernate / JPA
# ==========================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Security & JWT Configuration
jwt.key-dir=${JWT_KEY_DIR:./data/jwt-keys}
jwt.expiration-ms=86400000
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
dineflow.customer.base-url=${DINEFLOW_CUSTOMER_BASE_URL:http://localhost:3000}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
