upstream auth_service {
    server auth-service:8081;
}

upstream menu_service {
    server menu-service:3001;
}

upstream order_service {
    server order-service:3002;
}

upstream payment_service {
    server payment-service:3003;
}

upstream notification_service {
    server notification-service:3004;
}

upstream pwa_app {
    server app-pwa:80;
}

server {
    listen 80;
    server_name localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Auth Service Route (Spring Boot)
    # Support both the app's Docker URL (/api/auth) and the API gateway convention (/api/v1/auth)
    location /api/auth/ {
        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/ {
        # Preserve the auth controller's /auth prefix after stripping /api/v1.
        proxy_pass http://auth_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Menu Service Route (Node/Express)
    location /api/v1/menu/ {
        # Keep /api/v1/menu because the service mounts its routes at that prefix.
        client_max_body_size 5m;
        proxy_pass http://menu_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Order Service Route (Node/Express)
    location /api/v1/orders/ {
        proxy_pass http://order_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Payment Service Route (Node/Express)
    location /api/v1/payments/ {
        proxy_pass http://payment_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket Real-time Route (Notification Service)
    location /ws/ {
        proxy_pass http://notification_service/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Keep a lightweight API gateway health route while serving the web app at the root.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP","gateway":"Nginx API Gateway","message":"SCDP / DineFlow API Gateway is operational"}';
    }

    # Serve the installable DineFlow PWA from the default site origin.
    location / {
        proxy_pass http://pwa_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
