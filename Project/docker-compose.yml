networks:
  scdp-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  pgadmin_data:
  auth_jwt_keys:

services:
  # ----------------------------------------------------
  # Databases & Caches
  # ----------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: scdp-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scdp_db}
      POSTGRES_USER: ${POSTGRES_USER:-scdp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scdp_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scdp-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scdp-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@dineflow.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres-db
    networks:
      - scdp-network

  mongo-db:
    image: mongo:7.0
    container_name: scdp-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - scdp-network

  redis-cache:
    image: redis:7.2-alpine
    container_name: scdp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scdp-network

  # ----------------------------------------------------
  # Microservices
  
  # ----------------------------------------------------
  auth-service:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: scdp-auth-svc
    ports:
      - "8081:8081"
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-scdp_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-scdp_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-scdp_password}
      JWT_KEY_DIR: /var/lib/dineflow/auth-keys
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      # Customer links embedded in table QR codes must use an address reachable from phones.
      DINEFLOW_CUSTOMER_BASE_URL: ${DINEFLOW_CUSTOMER_BASE_URL:-http://192.168.137.1:3000}
    volumes:
      - auth_jwt_keys:/var/lib/dineflow/auth-keys
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - scdp-network

  menu-service:
    build:
      context: ./menu-service
      dockerfile: Dockerfile
    container_name: scdp-menu-svc
    ports:
      - "3001:3001"
    restart: always
    environment:
      PORT: 3001
      # Set MONGO_URI in the Compose .env file to use MongoDB Atlas.
      # Defaults to the local Compose database when MONGO_URI is not set.
      MONGO_URI: ${MONGO_URI:-mongodb://mongo-db:27017/scdp_menu}
      PG_URI: postgresql://${POSTGRES_USER:-scdp_user}:${POSTGRES_PASSWORD:-scdp_password}@postgres-db:5432/${POSTGRES_DB:-scdp_db}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
    depends_on:
      - postgres-db
      - mongo-db
      - redis-cache
    networks:
      - scdp-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: scdp-order-svc
    ports:
      - "3002:3002"
    restart: always
    environment:
      PORT: 3002
      POSTGRES_URI: postgresql://${POSTGRES_USER:-scdp_user}:${POSTGRES_PASSWORD:-scdp_password}@postgres-db:5432/${POSTGRES_DB:-scdp_db}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      AUTH_JWKS_URL: http://auth-service:8081/.well-known/jwks.json
      MENU_SERVICE_URL: http://menu-service:3001
    depends_on:
      - postgres-db
      - redis-cache
    networks:
      - scdp-network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: scdp-notif-svc
    ports:
      - "3004:3004"
    restart: always
    environment:
      PORT: 3004
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
    depends_on:
      - redis-cache
    networks:
      - scdp-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: scdp-payment-svc
    ports:
      - "3003:3003"
    restart: always
    environment:
      PORT: 3003
      POSTGRES_URI: postgresql://${POSTGRES_USER:-scdp_user}:${POSTGRES_PASSWORD:-scdp_password}@postgres-db:5432/${POSTGRES_DB:-scdp_db}
    depends_on:
      - postgres-db
    networks:
      - scdp-network

  # ----------------------------------------------------
  # Frontend PWA
  # ----------------------------------------------------
  app-pwa:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        # Tells the PWA to call /api/auth which the app's own nginx proxies to auth-service
        VITE_AUTH_BASE_URL: /api/auth
    container_name: scdp-app-pwa
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - menu-service
      - order-service
    networks:
      - scdp-network

  # ----------------------------------------------------
  # API Gateway / Reverse Proxy
  # ----------------------------------------------------
  nginx-gateway:
    image: nginx:alpine
    container_name: scdp-gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - menu-service
      - order-service
      - notification-service
      - payment-service
      - app-pwa
    networks:
      - scdp-network
